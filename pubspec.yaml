name: mimemo
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Location
  geolocator: ^14.0.1
  geocoding: ^5.0.0

  # Notification
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  firebase_notifications_handler: ^3.0.3

  # Local data
  shared_preferences: ^2.5.3

  # Route
  auto_route: ^11.1.0

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: any

  # State management
  flutter_bloc: ^9.1.1

  # Model
  equatable: ^2.0.7
  json_annotation: ^4.9.0

  # Api
  retrofit: ^4.4.2
  retrofit_generator: ^10.2.8
  dio: ^5.8.0+1
  pretty_dio_logger: ^1.4.0

  # DI
  get_it: ^9.2.1

  # Image, Icon
  flutter_svg: ^2.1.0
  cached_network_image: ^3.4.1

  # Firebase
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0

  supabase_flutter: ^2.9.1

  # Others
  google_mobile_ads: ^9.1.0
  gap: ^3.0.1
  collection: ^1.19.1
  logger: ^2.5.0
  smooth_page_indicator: ^2.0.1
  visibility_detector: ^0.4.0+2
  flutter_staggered_animations: ^1.1.1
  flutter_sticky_header: ^0.8.0
  google_maps_flutter: ^2.12.3
  scrollable_positioned_list: ^0.3.8
  dotted_line: ^3.2.3
  shimmer: ^3.0.0
  maplibre: ^0.3.3+2

dev_dependencies:
  flutter_test:
    sdk: flutter

  json_serializable: ^6.9.5
  build_runner: ^2.4.15
  auto_route_generator: ^10.1.0

  # Lint
  very_good_analysis: ^10.3.0
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  config:
    enable-swift-package-manager: true
  assets:
    - assets/icons/
    - assets/map_styles/
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700

flutter_intl:
  enabled: true
